name: My First CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  basic-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform version
        run: terraform version

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate

      - name: Show repository information
        run: |
          echo "My first CI pipeline is running"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Check Linux commands
        run: |
          pwd
          ls -la


      - name: Verify required project files
        run: |
          test -f README.md
          echo "Required project file exists"
      - name: Verify CI failure detection
        run: |
          echo "Testing exit codes"
          test -f README.md
